<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מתחבר לספוטיפיי</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .callback-container {
            text-align: center;
            padding: 50px 20px;
        }
        
        .spinner {
            border: 5px solid rgba(0, 56, 184, 0.1);
            border-radius: 50%;
            border-top: 5px solid var(--israeli-blue);
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .debug-info {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            direction: ltr;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="callback-container">
            <h1>מתחבר לספוטיפיי</h1>
            <div class="spinner"></div>
            <p>אנא המתן בזמן שאנו מתחברים לחשבון הספוטיפיי שלך...</p>
            
            <div class="debug-info" id="debug"></div>
            
            <button id="manualBtn" style="display:none; margin-top: 20px;" class="game-button">המשך באופן ידני</button>
        </div>
    </div>
    
    <script>
        // Simple debugging function
        function logDebug(message) {
            const debugElement = document.getElementById('debug');
            const timestamp = new Date().toISOString().substr(11, 8);
            debugElement.innerHTML += `[${timestamp}] ${message}\n`;
            console.log(message);
        }
        
        // Main function
        document.addEventListener('DOMContentLoaded', function() {
            logDebug('Callback page loaded');
            logDebug(`Current URL: ${window.location.href}`);
            
            // Check if we have the authorization code in the URL query parameters
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            const error = urlParams.get('error');
            
            logDebug(`URL parameters found: ${Array.from(urlParams.keys()).join(', ')}`);
            
            if (error) {
                logDebug(`ERROR received: ${error}`);
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('p').innerHTML = `שגיאה: ${error}. יתכן שהאימות נכשל.`;
                
                // Show manual button
                const manualBtn = document.getElementById('manualBtn');
                manualBtn.style.display = 'block';
                manualBtn.addEventListener('click', function() {
                    window.location.href = 'index.html';
                });
                return;
            }
            
            if (code) {
                logDebug('Authorization code found: ' + code);
                
                // Validate the state if present
                if (state) {
                    const storedState = localStorage.getItem('spotify_auth_state');
                    logDebug(`State validation: Received=${state}, Stored=${storedState}`);
                    
                    if (storedState !== state) {
                        logDebug('WARNING: State mismatch!');
                    }
                    
                    localStorage.removeItem('spotify_auth_state');
                }
                
                // Store the code in localStorage for the main app to use
                localStorage.setItem('spotify_auth_code', code);
                
                // In a real implementation, we would exchange this code for an access token
                // For now, we'll create a simulated token just for testing the UI
                const simulatedToken = 'simulated_' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('spotify_token', simulatedToken);
                
                logDebug('Simulated token stored in localStorage');
                
                // Redirect back to main page after a short delay
                setTimeout(function() {
                    logDebug('Redirecting to index.html');
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                logDebug('ERROR: No authorization code found in callback URL');
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('p').innerHTML = 'לא נמצא קוד אימות בכתובת ה-URL. יתכן שהאימות נכשל.';
                
                // Show manual button
                const manualBtn = document.getElementById('manualBtn');
                manualBtn.style.display = 'block';
                manualBtn.addEventListener('click', function() {
                    window.location.href = 'index.html';
                });
            }
        });
    </script>
</body>
</html>
