<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מתחבר לספוטיפיי</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .callback-container {
            text-align: center;
            padding: 50px 20px;
        }
        
        .spinner {
            border: 5px solid rgba(0, 56, 184, 0.1);
            border-radius: 50%;
            border-top: 5px solid var(--israeli-blue);
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .debug-info {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            direction: ltr;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="callback-container">
            <h1>מתחבר לספוטיפיי</h1>
            <div class="spinner"></div>
            <p>אנא המתן בזמן שאנו מתחברים לחשבון הספוטיפיי שלך...</p>
            
            <div class="debug-info" id="debug"></div>
            
            <button id="manualBtn" style="display:none; margin-top: 20px;" class="game-button">המשך באופן ידני</button>
        </div>
    </div>
    
    <script>
        // Simple debugging function
        function logDebug(message) {
            const debugElement = document.getElementById('debug');
            const timestamp = new Date().toISOString().substr(11, 8);
            debugElement.innerHTML += `[${timestamp}] ${message}\n`;
            console.log(message);
        }
        
        // Main function
        document.addEventListener('DOMContentLoaded', function() {
            logDebug('Callback page loaded');
            logDebug(`Current URL: ${window.location.href}`);
            
            // IMPORTANT: Log the URL structure to understand what we're receiving
            logDebug(`URL search (query params): ${window.location.search}`);
            logDebug(`URL hash: ${window.location.hash}`);
            
            // Check for the presence of an access token in the URL hash (Implicit Grant Flow)
            if (window.location.hash) {
                logDebug('Hash fragment found in URL');
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');
                const expiresIn = hashParams.get('expires_in');
                const state = hashParams.get('state');
                
                if (accessToken) {
                    logDebug('Access token found in hash fragment');
                    
                    // Validate state if present
                    if (state) {
                        const storedState = localStorage.getItem('spotify_auth_state');
                        logDebug(`State validation: Received=${state}, Stored=${storedState}`);
                        
                        if (state !== storedState) {
                            logDebug('State mismatch! Possible CSRF attack');
                            document.querySelector('.spinner').style.display = 'none';
                            document.querySelector('p').innerHTML = 'שגיאת אבטחה: אי התאמה במצב האימות. נסה שוב.';
                            
                            showManualButton();
                            return;
                        }
                        
                        localStorage.removeItem('spotify_auth_state');
                    }
                    
                    // Store the token in localStorage
                    localStorage.setItem('spotify_token', accessToken);
                    localStorage.setItem('spotify_token_expires', Date.now() + (parseInt(expiresIn) * 1000));
                    
                    logDebug('Token stored in localStorage');
                    logDebug(`Token expires in ${expiresIn} seconds`);
                    
                    // Redirect back to main page
                    setTimeout(function() {
                        logDebug('Redirecting to index.html');
                        window.location.href = 'index.html';
                    }, 1500);
                    
                    return;
                }
            }
            
            // Check if we have an error in the URL params
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            
            if (error) {
                logDebug(`ERROR received: ${error}`);
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('p').innerHTML = `שגיאה: ${error}. אנחנו עובדים על תיקון בעיה זו.`;
                
                showManualButton();
                return;
            }
            
            // If no access token was found in the hash and no error was found in the search params
            logDebug('No access token or authorization code found');
            document.querySelector('.spinner').style.display = 'none';
            document.querySelector('p').innerHTML = 'לא נמצא אסימון גישה בכתובת ה-URL. יתכן שהאימות נכשל.';
            
            showManualButton();
        });
        
        function showManualButton() {
            // Show manual button
            const manualBtn = document.getElementById('manualBtn');
            manualBtn.style.display = 'block';
            manualBtn.addEventListener('click', function() {
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
