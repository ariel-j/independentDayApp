<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חידון שירים ליום העצמאות</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="flag-container">
            <div class="flag left"></div>
            <h1>חידון שירים ליום העצמאות</h1>
            <div class="flag right"></div>
        </div>
        
        <div class="game-container">
            <div id="current-score">ניקוד: <span id="score">0</span></div>
            
            <div id="audio-player">
                <audio id="song-player" src=""></audio>
                <img id="album-cover" class="hidden" src="" alt="Album Cover">
                <div id="song-title" class="hidden"></div>
                <div id="song-artist" class="hidden"></div>
            </div>
            
            <div class="buttons-container">
                <button id="play-segment" class="game-button">נגן 2 שניות</button>
                <button id="play-next-segment" class="game-button">נגן שנייה נוספת</button>
                <button id="reveal-song" class="game-button">גלה את השיר</button>
                <button id="play-full" class="game-button">נגן את כל השיר</button>
                <button id="next-song" class="game-button">השיר הבא</button>
            </div>
            
            <div class="spotify-section">
                <button id="spotify-login" class="spotify-button">
                    <span class="spotify-icon">🎵</span> התחבר לספוטיפיי
                </button>
                <p class="spotify-note">חבר את ספוטיפיי כדי להשתמש בפלייליסט האישי שלך</p>
                <div id="spotify-status" style="margin-top: 10px; font-weight: bold;"></div>
                <div id="spotify-debug" style="margin-top: 10px; border: 1px solid #ddd; padding: 10px; background: #f9f9f9; direction: ltr; font-family: monospace; font-size: 12px; text-align: left; max-height: 150px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>
    
    <script src="songs.js"></script>
    <script src="config.js" type="module"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
